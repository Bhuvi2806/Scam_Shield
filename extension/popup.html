<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scam Shield 🛡️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #f1f5f9;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .title { font-size: 16px; font-weight: 800; color: #38bdf8; }
    .subtitle { font-size: 11px; color: #94a3b8; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      margin-bottom: 12px;
    }
    textarea {
      width: 100%;
      height: 70px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #f8fafc;
      padding: 8px;
      font-size: 12px;
      resize: none;
      margin-bottom: 8px;
    }
    textarea:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.15s;
    }
    button:hover { background: #0369a1; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .result-box {
      display: none;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .settings-group {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
    }
    .settings-label { color: #94a3b8; display: block; margin-bottom: 4px; }
    .settings-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #f8fafc;
      padding: 6px 8px;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
      margin-top: 8px;
    }
    .footer a { color: #38bdf8; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🛡️</span>
    <div>
      <div class="title">Scam Shield for WhatsApp</div>
      <div class="subtitle">Real-time fraud prevention extension</div>
    </div>
  </div>

  <div class="status-badge">
    <span>●</span>
    <span>Active on web.whatsapp.com</span>
  </div>

  <label for="quick-text" style="font-size: 11px; color: #cbd5e1; font-weight: 600; display: block; margin-bottom: 4px;">
    Quick Check / त्वरित जांच:
  </label>
  <textarea id="quick-text" placeholder="Paste any message here to test..."></textarea>
  <button id="quick-check-btn" type="button">Check Message</button>

  <div id="quick-result" class="result-box"></div>

  <div class="settings-group">
    <label class="settings-label" for="api-url-input">Scam Shield Backend API URL:</label>
    <input type="text" id="api-url-input" class="settings-input" value="http://localhost:8000" />
    <button id="save-settings-btn" style="background: #334155; margin-bottom: 6px;">Save Settings</button>
  </div>

  <div class="footer">
    <span>Helpline: <a href="tel:1930">1930</a></span>
    <a href="https://cybercrime.gov.in" target="_blank" rel="noreferrer">cybercrime.gov.in</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
